<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prachi & Pratik · Character studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2eadc;color:#302921;font:16px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:40px 24px}h1{font:normal 38px Georgia,serif;margin:0 0 12px}p{color:#6b6056;max-width:650px}.stage{display:flex;justify-content:center;background:#e7dccb;border-radius:24px;margin:30px 0;min-height:300px}.puppet{width:48%;max-width:360px}.puppet svg{width:100%;height:auto;display:block}fieldset{border:0;padding:0;margin:22px 0}legend{font-weight:600;margin-bottom:10px}button{font:inherit;padding:10px 18px;border:1px solid #b8a897;background:transparent;color:inherit;border-radius:30px;cursor:pointer;margin:0 6px 8px 0}button[aria-pressed=true]{background:#85382f;color:#fff8ee;border-color:#85382f}button:focus-visible{outline:3px solid #b67630;outline-offset:3px}a{color:#85382f}.note{font-size:13px} @media(max-width:500px){main{padding:28px 16px}h1{font-size:30px}.stage{margin:20px 0}}
</style></head><body><main><h1>A little more us.</h1><p>Two familiar faces, dressed for every part of the story. Choose an outfit, then try a gesture.</p><div class="stage"><div class="puppet" id="prachi"></div><div class="puppet" id="pratik"></div></div><fieldset id="looks"><legend>Dress for the moment</legend><button data-value="wedding" aria-pressed="true">Wedding</button><button data-value="haldi" aria-pressed="false">Haldi</button><button data-value="casual" aria-pressed="false">Everyday</button><button data-value="gym" aria-pressed="false">Gym</button></fieldset><fieldset id="actions"><legend>Say it with a gesture</legend><button data-value="idle" aria-pressed="true">Rest</button><button data-value="wave" aria-pressed="false">Hello</button><button data-value="namaste" aria-pressed="false">Namaste</button><button data-value="nod" aria-pressed="false">Yes!</button><button data-value="celebrate" aria-pressed="false">Celebrate</button></fieldset><p class="note">Motion follows your device’s reduced-motion preference. <a href="prachi.svg" download>Download Prachi</a> · <a href="pratik.svg" download>Download Pratik</a></p><p id="status" role="status"></p></main><script type="module">
try {
 await Promise.all(['prachi','pratik'].map(async name=>{const r=await fetch(`${name}.svg`);if(!r.ok)throw new Error('Unable to load character');document.getElementById(name).innerHTML=await r.text()}));
 for(const [group,attribute] of [['looks','data-look'],['actions','data-action']]) document.getElementById(group).addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;document.querySelectorAll(`#${group} button`).forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('.puppet svg').forEach(svg=>svg.setAttribute(attribute,button.dataset.value))});
}catch{document.getElementById('status').textContent='Open this preview through the website server so the SVG files can load.'}
</script></body></html>
