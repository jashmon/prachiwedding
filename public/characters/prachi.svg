<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560" role="img" aria-labelledby="prachi-title prachi-desc" data-character="prachi" data-look="wedding" data-action="idle">
<title id="prachi-title">Prachi · layered character</title><desc id="prachi-desc">A warm paper-cut inspired character with interchangeable wedding, haldi, casual and gym clothes. Separate head, eyes, arms and body for animation.</desc>
<defs>
<linearGradient id="prachi-skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffdfb7"/><stop offset=".65" stop-color="#ecc098"/><stop offset="1" stop-color="#cd8c69"/></linearGradient>
<linearGradient id="prachi-hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#644537"/><stop offset=".6" stop-color="#3e2a24"/><stop offset="1" stop-color="#201c1a"/></linearGradient>
<linearGradient id="prachi-cloth" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="var(--fabric-light,#df5545)"/><stop offset=".5" stop-color="var(--fabric,#b72e35)"/><stop offset="1" stop-color="var(--fabric-dark,#801e2c)"/></linearGradient>
<linearGradient id="prachi-gold"><stop stop-color="#b98642"/><stop offset=".45" stop-color="#f2d895"/><stop offset="1" stop-color="#c29a54"/></linearGradient>
<radialGradient id="prachi-blush"><stop stop-color="#db725f" stop-opacity=".58"/><stop offset="1" stop-color="#db725f" stop-opacity="0"/></radialGradient>
<filter id="prachi-depth" x="-20%" y="-15%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#4b2920" flood-opacity=".18"/></filter>
</defs>
<style>
[data-character="prachi"]{--fabric:#b72e35;--fabric-light:#df5545;--fabric-dark:#801e2c}
[data-character="prachi"][data-look="haldi"]{--fabric:#eeb525;--fabric-light:#ffdb59;--fabric-dark:#c58b13}
[data-character="prachi"][data-look="casual"]{--fabric:#338b66;--fabric-light:#60b58b;--fabric-dark:#19593e}
[data-character="prachi"][data-look="gym"]{--fabric:#d7658c;--fabric-light:#f39abb;--fabric-dark:#a73f65}
[data-character="prachi"] [data-outfit]{display:none}
[data-character="prachi"][data-look="wedding"] [data-outfit="wedding"]{display:inline}
[data-character="prachi"][data-look="haldi"] [data-outfit="haldi"]{display:inline}
[data-character="prachi"][data-look="casual"] [data-outfit="casual"]{display:inline}
[data-character="prachi"][data-look="gym"] [data-outfit="gym"]{display:inline}
[data-character="prachi"] [data-part="head"]{transform-origin:200px 268px}
[data-character="prachi"] [data-part="arm-left"]{transform-origin:155px 286px}
[data-character="prachi"] [data-part="arm-right"]{transform-origin:245px 286px}
[data-character="prachi"] [data-part="namaste-arms"]{display:none}
[data-character="prachi"][data-action="namaste"] [data-part="arm-left"],
[data-character="prachi"][data-action="namaste"] [data-part="arm-right"]{display:none}
[data-character="prachi"][data-action="namaste"] [data-part="namaste-arms"]{display:inline}
[data-character="prachi"][data-action="namaste"] [data-part="head"]{animation:prachi-namaste 2.8s ease-in-out infinite}
[data-character="prachi"][data-action="wave"] [data-part="arm-right"]{animation:prachi-wave 1.2s ease-in-out infinite}
[data-character="prachi"][data-action="celebrate"] [data-part="body"]{animation:prachi-bounce .75s ease-in-out infinite}
[data-character="prachi"][data-action="celebrate"] [data-part="arm-left"]{transform:rotate(135deg)}
[data-character="prachi"][data-action="celebrate"] [data-part="arm-right"]{transform:rotate(-135deg)}
[data-character="prachi"][data-action="nod"] [data-part="head"]{animation:prachi-nod 1.2s ease-in-out infinite}
@keyframes prachi-wave{0%,100%{transform:rotate(-140deg)}50%{transform:rotate(-115deg)}}
@keyframes prachi-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes prachi-nod{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@keyframes prachi-namaste{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(3px) rotate(-2deg)}}
@media(prefers-reduced-motion:reduce){[data-character="prachi"] *{animation:none!important}}
</style>
